<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Restaurante</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Georgia", serif;
            background-color: #D0B8A8; /* Fondo general café claro de los lados */
            color: #4A3B32; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- AQUÍ ESTÁ EL ARREGLO --- */
        .chat-container-wrapper {
            flex: 1;
            overflow-y: auto;
            width: 100%;
            max-width: 700px;
            margin: 0 auto; /* Centra la columna */
            background-color: #FFFFFF; /* El fondo blanco ahora está en el área que hace scroll */
            border-left: 1px solid #C4AFA0;
            border-right: 1px solid #C4AFA0;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1); 
            scroll-behavior: smooth;
        }

        .chat-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 30px 20px;
            min-height: max-content; /* Asegura que el contenedor abarque todos los mensajes */
        }
        /* ---------------------------- */

        .input-area {
            background-color: #D0B8A8; /* Mismo café claro del fondo general */
            display: flex;
            justify-content: center;
            padding: 20px;
            border-top: 1px solid #B89F8F;
        }

        .chat-form {
            width: 100%;
            max-width: 700px;
            display: flex;
            align-items: center;
            background-color: #FDFBF7;
            border-radius: 30px; 
            padding: 5px 10px 5px 20px;
            border: 1px solid #C4AFA0;
        }

        .chat-form input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 10px 5px;
            font-family: inherit;
            font-size: 15px;
            color: #4A3B32;
        }

        .chat-form input::placeholder {
            color: #A38F82;
            font-style: italic;
        }

        .chat-form button {
            background-color: #8C6A53; /* Botón color café oscuro */
            color: #FFFFFF;
            border: none;
            font-size: 18px;
            font-weight: bold;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s, transform 0.2s;
        }

        .chat-form button:hover {
            background-color: #705340;
            transform: scale(1.05);
        }

        .message-row {
            display: flex;
            width: 100%;
            animation: fadeIn 0.3s ease-out;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.ia {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 70%; 
            padding: 10px 15px; 
            border-radius: 12px;
            line-height: 1.4; 
            font-size: 14px; 
            white-space: pre-wrap;
        }

        /* BURBUJA DEL USUARIO: Café más oscuro para contrastar */
        .bubble.user {
            background-color: #8C6A53;
            color: #FFFFFF;
            border-bottom-right-radius: 0;
        }

        /* BURBUJA DE LA IA: Café muy clarito / Beige */
        .bubble.ia {
            background-color: #E8D8CD;
            color: #4A3B32;
            border-bottom-left-radius: 0;
            border: 1px solid #D6C2B4;
        }

        .bubble.loading {
            background: transparent;
            color: #8C6A53;
            font-style: italic;
            padding: 8px 0;
            box-shadow: none;
            border: none;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #B89F8F; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #A38F82; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="chat-container-wrapper" id="scroll-area">
        <div class="chat-container" id="chat-container">
            <div class="message-row ia">
                <div class="bubble ia">Bienvenido a la base de datos ¿Qué deseas consultar hoy?
                </div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <form class="chat-form" id="chat-form">
            <input type="text" id="user-input" placeholder="Escribe tu mensaje..." autocomplete="off" required>
            <button type="submit" id="submit-btn">↑</button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const scrollArea = document.getElementById('scroll-area');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const submitBtn = document.getElementById('submit-btn');

        const URL_WEBHOOK_N8N = "http://localhost:5678/webhook-test/Chat-restaurante";
        let estaCargando = false;

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (estaCargando) return;

            const texto = userInput.value.trim();
            if (!texto) return;

            agregarBurbuja(texto, 'user');
            userInput.value = '';

            estaCargando = true;
            submitBtn.style.opacity = '0.5';
            const idCarga = agregarBurbuja('Consultando la base de datos...', 'ia', true);

            try {
                const res = await fetch(URL_WEBHOOK_N8N, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: texto })
                });

                let respuestaTexto = "";
                const contentType = res.headers.get("content-type");
                
                if (contentType && contentType.includes("application/json")) {
                    const data = await res.json();
                    respuestaTexto = data.output || data.message || data.text || JSON.stringify(data);
                } else {
                    respuestaTexto = await res.text();
                }

                document.getElementById(idCarga).remove(); 
                agregarBurbuja(respuestaTexto || "Respuesta vacía del servidor.", 'ia');

            } catch (err) {
                console.error(err);
                document.getElementById(idCarga).remove();
                agregarBurbuja('Error de conexión con n8n. Revisa la consola.', 'ia');
            } finally {
                estaCargando = false;
                submitBtn.style.opacity = '1';
            }
        });

        function agregarBurbuja(texto, remitente, esCarga = false) {
            const id = 'msg-' + Date.now();
            
            const row = document.createElement('div');
            row.className = `message-row ${remitente}`;
            row.id = id;

            const bubble = document.createElement('div');
            bubble.className = `bubble ${remitente} ${esCarga ? 'loading' : ''}`;
            bubble.innerText = texto;

            row.appendChild(bubble);
            chatContainer.appendChild(row);

            scrollArea.scrollTop = scrollArea.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
